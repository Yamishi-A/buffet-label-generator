<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buffet Label Studio - Pro</title>
  <style>
    :root {
      /* Dynamic Layout Variables */
      --card-border-color: #5bc0be;
      --card-text-color: #5bc0be;
      --card-bg-color: #ffffff;
      --card-border-width: 2.5px;
      --card-border-style: solid;
      --card-font-size: 0.72rem;
      --card-lang-gap: 8px;          /* Spacing between different languages */
      --card-title-ing-gap: 1px;     /* Spacing between title & ingredients */
      --card-text-transform: uppercase;
      --logo-height: 50px;

      /* Dashboard Theme Default */
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --panel-bg: rgba(255, 255, 255, 0.95);
      --panel-border: rgba(255, 255, 255, 0.8);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #f8fafc;
      --input-border: #cbd5e1;
      --accent-color: #0ea5e9;
      --accent-hover: #0284c7;
      --border-radius: 14px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.1);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.05);
      --cut-line-color: #cbd5e1;
    }

    body.dark-mode {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --panel-bg: rgba(30, 41, 59, 0.95);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --input-border: #334155;
      --cut-line-color: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .app-wrapper {
      width: 100%;
      max-width: 1300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Action Bar */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      padding: 16px 28px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--panel-border);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    body.dark-mode .brand-title h1 {
      background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-badge {
      font-size: 0.75rem;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 700;
    }

    body.dark-mode .brand-badge {
      background: #0369a1;
      color: #e0f2fe;
    }

    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-theme-toggle, .btn-print {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-theme-toggle {
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--input-border);
    }

    .btn-print {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
    }

    .btn-print:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }

    .preview-stage {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow-x: auto;
      padding: 10px 0;
    }

    .a4-page {
      position: relative;
      width: 297mm;
      height: 210mm;
      background: #ffffff;
      padding: 6mm;
      box-shadow: var(--shadow-lg);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 3mm;
      border-radius: 4px;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    /* Cut Guidelines */
    .cut-line-v, .cut-line-h {
      position: absolute;
      pointer-events: none;
      z-index: 5;
    }

    .cut-line-v {
      top: 0;
      bottom: 0;
      width: 0;
      border-left: 1px dashed var(--cut-line-color);
    }

    .cut-line-h {
      left: 0;
      right: 0;
      height: 0;
      border-top: 1px dashed var(--cut-line-color);
    }

    .cut-v-1 { left: 76.5mm; }
    .cut-v-2 { left: 148.5mm; }
    .cut-v-3 { left: 220.5mm; }
    .cut-h-1 { top: 105mm; }

    .card {
      border-width: var(--card-border-width);
      border-style: var(--card-border-style);
      border-color: var(--card-border-color);
      background-color: var(--card-bg-color);
      padding: 8px 6px 6px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      height: 100%;
      width: 100%;
      border-radius: 3px;
      overflow: hidden;
      z-index: 10;
    }

    /* 1. Header Logos (Max Top Pinned) */
    .card-logos {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
      height: var(--logo-height);
      padding: 0 2px;
      flex-shrink: 0;
    }

    .card-logos img {
      height: 100%;
      max-height: var(--logo-height);
      max-width: 45%;
      object-fit: contain;
    }

    /* 2. Middle Text Block */
    .card-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      width: 100%;
      color: var(--card-text-color);
      gap: var(--card-lang-gap); /* Spacing between languages */
      padding: 4px 2px;
      flex: 1; /* Pushes allergens to lower half */
    }

    .lang-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--card-title-ing-gap); /* Spacing between Title and Ingredients */
      width: 100%;
      line-height: 1.15;
    }

    .lang-block .title {
      font-size: var(--card-font-size);
      font-weight: 700;
      text-transform: var(--card-text-transform);
      letter-spacing: 0.015em;
      word-break: break-word;
    }

    .lang-block .ingredients {
      font-size: calc(var(--card-font-size) * 0.78);
      text-transform: none;
      font-weight: 500;
      font-style: italic;
      opacity: 0.88;
      word-break: break-word;
    }

    /* 3. Allergen Icons Container (Bottom Half - Centered Dynamic Fill) */
    .card-allergens {
      display: flex;
      justify-content: center;
      align-items: center;  /* Vertically center inside bottom half */
      align-content: center; /* Vertically center multi-row wrap */
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      flex: 1.2; /* Generous space in bottom half */
      padding: 4px 2px;
      box-sizing: border-box;
      min-height: 0;
    }

    .card-allergens img {
      object-fit: contain;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .controls-dashboard {
      width: 100%;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
    }

    .control-card {
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border-radius: var(--border-radius);
      padding: 22px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .control-group label span.val-indicator {
      color: var(--accent-color);
      font-family: ui-monospace, monospace;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .color-picker-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--input-bg);
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
    }

    .color-picker-box input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }

    .color-picker-box input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-picker-box input[type="color"]::-webkit-color-swatch {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    .hex-val {
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-main);
    }

    select, input[type="range"] {
      width: 100%;
    }

    select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.85rem;
      outline: none;
    }

    input[type="range"] {
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .swatches {
      display: flex;
      gap: 8px;
    }

    .swatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid white;
      box-shadow: 0 0 0 1px #cbd5e1;
    }

    textarea#csvData {
      width: 100%;
      height: 210px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.825rem;
      padding: 14px;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      resize: vertical;
      color: var(--text-main);
      background-color: var(--input-bg);
      line-height: 1.5;
    }

    textarea#csvData:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
    }

    .preset-btns {
      display: flex;
      gap: 8px;
    }

    .btn-preset {
      font-size: 0.75rem;
      padding: 4px 10px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      color: var(--text-main);
      font-weight: 600;
      cursor: pointer;
    }

    .allergen-tags-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .tag-btn {
      font-size: 0.725rem;
      background-color: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--input-border);
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .tag-btn:hover {
      background-color: #e0f2fe;
      color: #0284c7;
      border-color: #bae6fd;
    }

    @media print {
      body {
        background: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .top-bar, .controls-dashboard {
        display: none !important;
      }

      .app-wrapper {
        padding: 0 !important;
        gap: 0 !important;
        max-width: none !important;
      }

      .preview-stage {
        padding: 0 !important;
      }

      .a4-page {
        box-shadow: none !important;
        width: 297mm !important;
        height: 210mm !important;
        margin: 0 !important;
        padding: 6mm !important;
        page-break-after: always;
        border-radius: 0 !important;
        background: #ffffff !important;
      }

      .cut-line-v, .cut-line-h {
        border-color: #94a3b8 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      @page {
        size: A4 landscape;
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Top Action Bar -->
    <div class="top-bar">
      <div class="brand-title">
        <h1>Buffet Label Studio</h1>
        <span class="brand-badge">A4 Landscape • 8 Cards</span>
      </div>

      <div class="top-bar-actions">
        <button class="btn-theme-toggle" onclick="toggleDarkMode()">
          <span id="darkIcon">🌙</span>
          <span id="darkText">Dark Mode</span>
        </button>

        <button class="btn-print" onclick="window.print()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
          </svg>
          Print Page
        </button>
      </div>
    </div>

    <!-- Live Preview Stage -->
    <div class="preview-stage">
      <div class="a4-page" id="a4Page">
        <div class="cut-line-v cut-v-1"></div>
        <div class="cut-line-v cut-v-2"></div>
        <div class="cut-line-v cut-v-3"></div>
        <div class="cut-line-h cut-h-1"></div>
      </div>
    </div>

    <!-- Dashboard Controls -->
    <div class="controls-dashboard">
      <div class="control-card">
        <div class="section-title">Design & Dimensions</div>

        <div class="color-grid">
          <div class="color-picker-box">
            <input type="color" id="borderColor" value="#5bc0be">
            <span id="borderHex" class="hex-val">#5BC0BE</span>
          </div>

          <div class="color-picker-box">
            <input type="color" id="textColor" value="#5bc0be">
            <span id="textHex" class="hex-val">#5BC0BE</span>
          </div>

          <div class="color-picker-box">
            <input type="color" id="bgColor" value="#ffffff">
            <span id="bgHex" class="hex-val">#FFFFFF</span>
          </div>
        </div>

        <div class="control-group">
          <label>Quick Color Themes</label>

          <div class="swatches">
            <div class="swatch" style="background:#5bc0be" onclick="applyTheme('#5bc0be', '#5bc0be')"></div>
            <div class="swatch" style="background:#1b365d" onclick="applyTheme('#1b365d', '#1b365d')"></div>
            <div class="swatch" style="background:#00875a" onclick="applyTheme('#00875a', '#00875a')"></div>
            <div class="swatch" style="background:#8b0000" onclick="applyTheme('#8b0000', '#8b0000')"></div>
            <div class="swatch" style="background:#d4af37" onclick="applyTheme('#d4af37', '#b8860b')"></div>
            <div class="swatch" style="background:#0f172a" onclick="applyTheme('#0f172a', '#334155')"></div>
          </div>
        </div>

        <hr style="border:0; border-top:1px solid var(--input-border);">

        <div class="control-group">
          <label>Logo Size <span class="val-indicator" id="logoSizeVal">50px</span></label>
          <input type="range" id="logoSize" min="20" max="50" value="50">
        </div>

        <div class="control-group">
          <label>Font Size <span class="val-indicator" id="fontSizeVal">0.72rem</span></label>
          <input type="range" id="fontSize" min="0.50" max="2.00" step="0.01" value="0.72">
        </div>

        <!-- Language Spacing Control -->
        <div class="control-group">
          <label>Language Gap (Between EN & GR) <span class="val-indicator" id="langGapVal">8px</span></label>
          <input type="range" id="langGap" min="0" max="20" step="1" value="8">
        </div>

        <!-- Title & Ingredient Proximity Control -->
        <div class="control-group">
          <label>Title & Ingredients Gap <span class="val-indicator" id="titleIngGapVal">1px</span></label>
          <input type="range" id="titleIngGap" min="0" max="10" step="1" value="1">
        </div>

        <div class="control-group">
          <label>Border Style & Width</label>

          <div style="display:flex; gap:8px;">
            <select id="borderStyle">
              <option value="solid" selected>Solid Border</option>
              <option value="double">Double Border</option>
              <option value="dashed">Dashed Border</option>
            </select>

            <input type="range" id="borderWidth" min="1" max="6" step="0.5" value="2.5">
          </div>
        </div>

        <div class="control-group">
          <label>Text Case</label>

          <select id="textTransform">
            <option value="uppercase" selected>UPPERCASE</option>
            <option value="capitalize">Title Case</option>
            <option value="none">As Typed</option>
          </select>
        </div>
      </div>

      <!-- Content Inputs -->
      <div class="control-card">
        <div class="section-title">
          <span>Label Content (1 Line = 1 Card)</span>

          <div class="preset-btns">
            <button class="btn-preset" onclick="loadSample('dishes')">Sample: Dishes</button>
            <button class="btn-preset" onclick="loadSample('fruit')">Sample: Fruit</button>
          </div>
        </div>

        <div class="control-group" style="margin-bottom: 4px;">
          <a href="https://gemini.google.com/gem/1ikNPq5aTkdJIGP0vCJvz-Sl0iuJNumkm?usp=sharing"
             target="_blank"
             rel="noopener noreferrer"
             style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px 14px; background: #1a73e8; color: #ffffff; font-weight: 600; font-size: 0.85rem; text-decoration: none; border-radius: 8px;">
            ✨ Open AI Label Assistant
          </a>
        </div>

        <textarea id="csvData" placeholder="Dish Title (Ingredients), Greek Title (Ingredients) | allergen1, allergen2"></textarea>

        <div>
          <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700;">Add Allergen Tag to active line:</span>
          <div class="allergen-tags-cloud" id="tagsCloud"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ASSETS = {
      logoLeft: 'assets/harmony-logo.png',
      logoRight: 'assets/concept-logo.png',
      allergens: {
        gluten: 'assets/gluten.jpg',
        crustaceans: 'assets/crustaceans.jpg',
        eggs: 'assets/eggs.jpg',
        fish: 'assets/fish.jpg',
        peanuts: 'assets/peanuts.jpg',
        soy: 'assets/soy.jpg',
        milk: 'assets/milk.jpg',
        nuts: 'assets/nuts.jpg',
        celery: 'assets/celery.jpg',
        mustard: 'assets/mustard.jpg',
        lupin: 'assets/lupin.jpg',
        sesame: 'assets/sesame.jpg',
        molluscs: 'assets/molluscs.jpg',
        sulfites: 'assets/sulfites.jpg',
        vegetarian: 'assets/vegetarian.jpg'
      }
    };

    const SAMPLES = {
      dishes: `MOUSAKA (Eggplant, Zucchini, Potatoes, Beef, Milk, Gluten, Eggs), ΜΟΥΣΑΚΑΣ (Μελιτζάνα, Κολοκυθάκι, Πατάτες, Βοδινός κιμάς, Γάλα, Γλουτένη, Αυγά) | gluten, milk, eggs
BOUGATSA (Semolina Custard, Phyllo), ΜΠΟΥΓΑΤΣΑ (Κρέμα σιμιγδάλι, Φύλλο) | gluten, milk, eggs
CHEESE PIE (Feta Cheese, Phyllo), ΤΥΡΟΠΙΤΑ (Φέτα, Φύλλο) | gluten, milk, eggs
SPINACH PIE (Spinach, Feta Cheese, Phyllo), ΣΠΑΝΑΚΟΠΙΤΑ (Σπανάκι, Φέτα, Φύλλο) | gluten, milk, vegetarian
SCRAMBLED EGGS (Eggs, Milk, Butter), ΑΥΓΑ ΣΚΡΑΜΠΛ (Αυγά, Γάλα, Βούτυρο) | eggs, milk
BUTTER CROISSANT (Flour, Butter, Sugar), ΚΡΟΥΑΣΑΝ ΒΟΥΤΥΡΟΥ (Αλεύρι, Βούτυρο, Ζάχαρη) | gluten, milk
CHOCOLATE CROISSANT (Flour, Butter, Chocolate), ΚΡΟΥΑΣΑΝ ΣΟΚΟΛΑΤΑ (Αλεύρι, Βούτυρο, Σοκολάτα) | gluten, milk, soy
OATMEAL PORRIDGE (Oats, Milk, Honey), ΧΥΛΟΣ ΒΡΩΜΗΣ (Βρώμη, Γάλα, Μέλι) | gluten, milk`,
      fruit: `YOGURT WITH FRUIT (Milk, Fresh Seasonal Fruit), ΓΙΑΟΥΡΤΙ ΜΕ ΦΡΟΥΤΑ (Γάλα, Φρέσκα Φρούτα) | milk, vegetarian
YOGURT WITH STRAWBERRY (Milk, Strawberry Jam), ΓΙΑΟΥΡΤΙ ΜΕ ΦΡΑΟΥΛΑ (Γάλα, Μαρμελάδα Φράουλα) | milk, vegetarian
PEAR COMPOTE (Pear, Syrup), ΚΟΜΠΟΣΤΑ ΑΧΛΑΔΙ (Αχλάδι, Σιρόπι) | sulfites, vegetarian
PINEAPPLE COMPOTE (Pineapple, Syrup), ΚΟΜΠΟΣΤΑ ΑΝΑΝΑ (Ανανάς, Σιρόπι) | sulfites, vegetarian
FRUIT SALAD (Mixed Fresh Fruits), ΦΡΟΥΤΟΣΑΛΑΤΑ (Ανάμεικτα Φρέσκα Φρούτα) | vegetarian`
    };

    const csvDataInput = document.getElementById('csvData');
    const borderColorInput = document.getElementById('borderColor');
    const textColorInput = document.getElementById('textColor');
    const bgColorInput = document.getElementById('bgColor');
    const borderHex = document.getElementById('borderHex');
    const textHex = document.getElementById('textHex');
    const bgHex = document.getElementById('bgHex');
    const a4Page = document.getElementById('a4Page');
    const tagsCloud = document.getElementById('tagsCloud');

    const logoSizeInput = document.getElementById('logoSize');
    const fontSizeInput = document.getElementById('fontSize');
    const langGapInput = document.getElementById('langGap');
    const titleIngGapInput = document.getElementById('titleIngGap');
    const borderWidthInput = document.getElementById('borderWidth');
    const borderStyleInput = document.getElementById('borderStyle');
    const textTransformInput = document.getElementById('textTransform');

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      document.getElementById('darkIcon').textContent = isDark ? '☀️' : '🌙';
      document.getElementById('darkText').textContent = isDark ? 'Light Mode' : 'Dark Mode';
    }

    csvDataInput.value = SAMPLES.dishes;

    // Allergen Tags Quick Insert
    Object.keys(ASSETS.allergens).forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'tag-btn';
      btn.textContent = `+ ${key}`;
      btn.type = 'button';
      btn.onclick = () => insertTag(key);
      tagsCloud.appendChild(btn);
    });

    function insertTag(tag) {
      const cursor = csvDataInput.selectionStart;
      const val = csvDataInput.value;
      csvDataInput.value = val.slice(0, cursor) + `, ${tag}` + val.slice(cursor);
      renderCards();
    }

    function loadSample(key) {
      csvDataInput.value = SAMPLES[key] || '';
      renderCards();
    }

    function applyTheme(border, text) {
      borderColorInput.value = border;
      textColorInput.value = text;
      borderHex.textContent = border.toUpperCase();
      textHex.textContent = text.toUpperCase();
      document.documentElement.style.setProperty('--card-border-color', border);
      document.documentElement.style.setProperty('--card-text-color', text);
    }

    // Event Listeners
    borderColorInput.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--card-border-color', e.target.value);
      borderHex.textContent = e.target.value.toUpperCase();
    });

    textColorInput.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--card-text-color', e.target.value);
      textHex.textContent = e.target.value.toUpperCase();
    });

    bgColorInput.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--card-bg-color', e.target.value);
      bgHex.textContent = e.target.value.toUpperCase();
    });

    logoSizeInput.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--logo-height', `${e.target.value}px`);
      document.getElementById('logoSizeVal').textContent = `${e.target.value}px`;
    });

    fontSizeInput.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--card-font-size', `${e.target.value}rem`);
      document.getElementById('fontSizeVal').textContent = `${e.target.value}rem`;
    });

    langGapInput.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--card-lang-gap', `${e.target.value}px`);
      document.getElementById('langGapVal').textContent = `${e.target.value}px`;
    });

    titleIngGapInput.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--card-title-ing-gap', `${e.target.value}px`);
      document.getElementById('titleIngGapVal').textContent = `${e.target.value}px`;
    });

    borderWidthInput.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--card-border-width', `${e.target.value}px`);
    });

    borderStyleInput.addEventListener('change', (e) => {
      document.documentElement.style.setProperty('--card-border-style', e.target.value);
    });

    textTransformInput.addEventListener('change', (e) => {
      document.documentElement.style.setProperty('--card-text-transform', e.target.value);
    });

    // Helper: Generates a sleek SVG Data URI badge if local assets are missing (e.g., in live browser preview)
    function generateFallbackBadge(label) {
      const canvas = document.createElement('canvas');
      canvas.width = 120;
      canvas.height = 120;
      const ctx = canvas.getContext('2d');

      // Outer circle
      ctx.fillStyle = '#0ea5e9';
      ctx.beginPath();
      ctx.arc(60, 60, 56, 0, Math.PI * 2);
      ctx.fill();

      // Inner circle
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(60, 60, 48, 0, Math.PI * 2);
      ctx.fill();

      // Text label
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const displayText = label.length > 7 ? label.substring(0, 6) + '.' : label;
      ctx.fillText(displayText.toUpperCase(), 60, 60);

      return canvas.toDataURL();
    }

    // Flexible Line Parser
    function parseLine(line) {
      const parts = line.split('|');
      const mainPart = (parts[0] || '').trim();

      const explicitAllergens = parts[1]
        ? parts[1].split(',').map(s => s.trim().toLowerCase()).filter(Boolean)
        : [];

      const entries = [];

      // Match each "TITLE (INGREDIENTS)" language pair cleanly
      const langBlockRegex = /([^()\n]+?)\s*\(([^()]*)\)/g;
      let match;

      while ((match = langBlockRegex.exec(mainPart)) !== null) {
        // Strip leading commas or spaces left over between language blocks
        let title = match[1].trim().replace(/^,\s*/, '');
        const desc = match[2].trim();

        if (title || desc) {
          entries.push({ title, desc });
        }
      }

      // Fallback for lines without parentheses
      if (entries.length === 0 && mainPart) {
        entries.push({ title: mainPart, desc: '' });
      }

      // Allergen auto-detection
      const knownAllergens = Object.keys(ASSETS.allergens);
      const autoAllergens = [];
      const lowerLine = line.toLowerCase();

      knownAllergens.forEach(alg => {
        if (lowerLine.includes(alg) && !autoAllergens.includes(alg)) {
          autoAllergens.push(alg);
        }
      });

      const finalAllergens = explicitAllergens.length > 0
        ? Array.from(new Set(explicitAllergens))
        : Array.from(new Set(autoAllergens));

      return {
        entries: entries,
        allergens: finalAllergens
      };
    }

    function renderCards() {
      const lines = csvDataInput.value.split('\n').filter(line => line.trim() !== '');
      const data = lines.map(parseLine);

      const cutLinesHTML = `
        <div class="cut-line-v cut-v-1"></div>
        <div class="cut-line-v cut-v-2"></div>
        <div class="cut-line-v cut-v-3"></div>
        <div class="cut-line-h cut-h-1"></div>
      `;

      a4Page.innerHTML = cutLinesHTML;

      for (let i = 0; i < 8; i++) {
        const cardData = data[i] || { entries: [], allergens: [] };

        const cardEl = document.createElement('div');
        cardEl.className = 'card';

        // 1. Logos (Max Top)
        const logosDiv = document.createElement('div');
        logosDiv.className = 'card-logos';

        logosDiv.innerHTML = `
          <img src="${ASSETS.logoLeft}" alt="Logo Left" onerror="this.style.opacity='0.2'">
          <img src="${ASSETS.logoRight}" alt="Logo Right" onerror="this.style.opacity='0.2'">
        `;

        // 2. Middle Text Block with Language Grouping
        const textDiv = document.createElement('div');
        textDiv.className = 'card-text';

        cardData.entries.forEach(entry => {
          const langBlock = document.createElement('div');
          langBlock.className = 'lang-block';

          if (entry.title) {
            const titleEl = document.createElement('div');
            titleEl.className = 'title';
            titleEl.textContent = entry.title;
            langBlock.appendChild(titleEl);
          }

          if (entry.desc) {
            const descEl = document.createElement('div');
            descEl.className = 'ingredients';
            descEl.textContent = `(${entry.desc})`;
            langBlock.appendChild(descEl);
          }

          textDiv.appendChild(langBlock);
        });

        // 3. Bottom-Half Allergen Icons Container
        const allergenDiv = document.createElement('div');
        allergenDiv.className = 'card-allergens';

        const count = cardData.allergens.length;

        cardData.allergens.forEach(allergenKey => {
          const imgSrc = ASSETS.allergens[allergenKey] || `assets/${allergenKey}.jpg`;
          const img = document.createElement('img');
          img.src = imgSrc;
          img.alt = allergenKey;
          img.title = allergenKey;

          // DYNAMIC ICON SIZING RULES:
          // 1 to 3 icons: Uniform 80px height in a SINGLE row (never wraps).
          // 4 icons: 2x2 grid layout at 68px height.
          // 5+ icons: Multi-row grid scaled down to prevent card overflow.
          if (count <= 3) {
            img.style.height = '80px';
            img.style.maxHeight = '80px';
            img.style.objectFit = 'contain';

            if (count === 1) {
              img.style.width = 'auto';
              img.style.maxWidth = '75%';
            } else if (count === 2) {
              img.style.width = 'auto';
              img.style.maxWidth = 'calc(46% - 4px)';
            } else if (count === 3) {
              img.style.width = 'auto';
              img.style.maxWidth = 'calc(31% - 4px)';
            }

          } else if (count === 4) {
            // 4 icons: 2x2 grid
            img.style.width = 'calc(44% - 4px)';
            img.style.height = '68px';
            img.style.maxHeight = '68px';
            img.style.objectFit = 'contain';

          } else if (count <= 6) {
            // 5 to 6 icons: 2 rows of 3
            img.style.width = 'calc(31% - 4px)';
            img.style.height = '52px';
            img.style.maxHeight = '52px';
            img.style.objectFit = 'contain';

          } else if (count <= 8) {
            // 7 to 8 icons: 2 rows of 4
            img.style.width = 'calc(23% - 4px)';
            img.style.height = '42px';
            img.style.maxHeight = '42px';
            img.style.objectFit = 'contain';

          } else {
            // 9+ icons
            img.style.width = 'calc(18% - 4px)';
            img.style.height = '32px';
            img.style.maxHeight = '32px';
            img.style.objectFit = 'contain';
          }

          img.onerror = () => {
            img.style.border = '1px dashed #cbd5e1';
            img.style.borderRadius = '50%';
          };

          allergenDiv.appendChild(img);
        });

        cardEl.appendChild(logosDiv);
        cardEl.appendChild(textDiv);
        cardEl.appendChild(allergenDiv);

        a4Page.appendChild(cardEl);
      }
    }

    csvDataInput.addEventListener('input', renderCards);
    renderCards();
  </script>
</body>
</html>
